<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Document Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-grey: #2D3748;
            --secondary-grey: #4A5568;
            --light-grey: #E2E8F0;
            --lighter-grey: #F7FAFC;
            --dark-grey: #1A202C;
            --accent-grey: #718096;
            --success-color: #48BB78;
            --warning-color: #ED8936;
            --error-color: #F56565;
            --info-color: #4299E1;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--lighter-grey) 0%, var(--light-grey) 100%);
            color: var(--primary-grey);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Loading Spinner */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 9999;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--light-grey);
            border-top: 4px solid var(--primary-grey);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Navigation */
        .navbar {
            background: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-grey);
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: var(--secondary-grey);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary-grey);
        }

        .user-menu {
            position: relative;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-grey);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
        }

        .dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            min-width: 200px;
            padding: 0.5rem 0;
            display: none;
            z-index: 1001;
        }

        .dropdown.show {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--secondary-grey);
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .dropdown-item:hover {
            background: var(--lighter-grey);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Auth Forms */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 200px);
        }

        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary-grey);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--secondary-grey);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--light-grey);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-grey);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary-grey);
            color: white;
        }

        .btn-primary:hover {
            background: var(--dark-grey);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--light-grey);
            color: var(--secondary-grey);
        }

        .btn-secondary:hover {
            background: var(--accent-grey);
            color: white;
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-danger {
            background: var(--error-color);
            color: white;
        }

        .btn-full {
            width: 100%;
        }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-icon {
            font-size: 3rem;
            color: var(--primary-grey);
            margin-bottom: 1rem;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-grey);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--accent-grey);
            font-weight: 500;
        }

        /* File Management */
        .file-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            border: 2px solid var(--light-grey);
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-grey);
        }

        .filter-select {
            padding: 0.75rem 1rem;
            border: 2px solid var(--light-grey);
            border-radius: var(--border-radius);
            background: white;
            font-size: 1rem;
        }

        /* File Upload */
        .upload-area {
            border: 3px dashed var(--light-grey);
            border-radius: var(--border-radius);
            padding: 3rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: var(--primary-grey);
            background: var(--lighter-grey);
        }

        .upload-icon {
            font-size: 4rem;
            color: var(--accent-grey);
            margin-bottom: 1rem;
        }

        .upload-text {
            font-size: 1.2rem;
            color: var(--secondary-grey);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: var(--accent-grey);
            font-size: 0.9rem;
        }

        /* File Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .file-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .file-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .file-preview {
            height: 200px;
            background: var(--lighter-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .file-icon {
            font-size: 4rem;
            color: var(--accent-grey);
        }

        .file-info {
            padding: 1.5rem;
        }

        .file-name {
            font-weight: 600;
            color: var(--primary-grey);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .file-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--accent-grey);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .file-actions-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--light-grey);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-grey);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--accent-grey);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--light-grey);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        /* Alerts */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alert-success {
            background: #F0FFF4;
            color: #22543D;
            border: 1px solid #9AE6B4;
        }

        .alert-error {
            background: #FED7D7;
            color: #742A2A;
            border: 1px solid #FEB2B2;
        }

        .alert-warning {
            background: #FFFAF0;
            color: #7B341E;
            border: 1px solid #F6AD55;
        }

        .alert-info {
            background: #EBF8FF;
            color: #2A4365;
            border: 1px solid #90CDF4;
        }

        /* Progress Bar */
        .progress {
            width: 100%;
            height: 8px;
            background: var(--light-grey);
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-grey);
            transition: width 0.3s ease;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }

            .container {
                padding: 0 1rem;
            }

            .auth-card {
                padding: 2rem;
                margin: 1rem;
            }

            .file-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .search-container {
                max-width: none;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .file-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Utilities */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .hidden { display: none; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 1rem; }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div class="loading hidden" id="loading">
        <div class="spinner"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar hidden" id="navbar">
        <div class="nav-container">
            <a href="#" class="logo">
                <i class="fas fa-graduation-cap"></i>
                TeacherDocs
            </a>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link" data-page="dashboard">Dashboard</a></li>
                <li><a href="#" class="nav-link" data-page="files">My Files</a></li>
                <li><a href="#" class="nav-link" data-page="upload">Upload</a></li>
            </ul>
            <div class="user-menu">
                <div class="user-avatar" id="userAvatar">
                    <span id="userInitials">U</span>
                </div>
                <div class="dropdown" id="userDropdown">
                    <a href="#" class="dropdown-item" data-page="profile">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <a href="#" class="dropdown-item" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Auth Page -->
        <div id="authPage" class="auth-container">
            <div class="auth-card">
                <h2 class="auth-title" id="authTitle">Welcome Back</h2>
                <div id="authAlert"></div>
                
                <form id="authForm">
                    <div class="form-group" id="fullNameGroup" style="display: none;">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="fullName" placeholder="Enter your full name">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-input" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-group" id="subjectGroup" style="display: none;">
                        <label class="form-label">Subject (Optional)</label>
                        <input type="text" class="form-input" id="subject" placeholder="e.g., Mathematics">
                    </div>
                    
                    <div class="form-group" id="schoolGroup" style="display: none;">
                        <label class="form-label">School (Optional)</label>
                        <input type="text" class="form-input" id="school" placeholder="Enter your school name">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full" id="authSubmit">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="#" id="authToggle">Don't have an account? Sign up</a>
                </div>
            </div>
        </div>

        <!-- Dashboard Page -->
        <div id="dashboardPage" class="hidden">
            <h1 class="mb-3">Dashboard</h1>
            <div class="dashboard-grid" id="statsGrid">
                <!-- Statistics cards will be loaded here -->
            </div>
            
            <div class="file-grid" id="recentFiles">
                <!-- Recent files will be loaded here -->
            </div>
        </div>

        <!-- Files Page -->
        <div id="filesPage" class="hidden">
            <div class="file-actions">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchFiles" placeholder="Search files...">
                </div>
                
                <div class="flex items-center gap-2">
                    <select class="filter-select" id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="document">Documents</option>
                        <option value="image">Images</option>
                        <option value="presentation">Presentations</option>
                        <option value="spreadsheet">Spreadsheets</option>
                        <option value="other">Other</option>
                    </select>
                    
                    <select class="filter-select" id="sortBy">
                        <option value="created_at">Date Created</option>
                        <option value="original_name">Name</option>
                        <option value="file_size">Size</option>
                        <option value="download_count">Downloads</option>
                    </select>
                </div>
            </div>
            
            <div class="file-grid" id="filesGrid">
                <!-- Files will be loaded here -->
            </div>
            
            <div class="text-center mt-3">
                <button class="btn btn-secondary" id="loadMoreFiles" style="display: none;">
                    Load More Files
                </button>
            </div>
        </div>

        <!-- Upload Page -->
        <div id="uploadPage" class="hidden">
            <h1 class="mb-3">Upload Files</h1>
            
            <div class="upload-area" id="uploadArea">
                <i class="fas fa-cloud-upload-alt upload-icon"></i>
                <div class="upload-text">Drag and drop files here</div>
                <div class="upload-hint">or click to select files</div>
                <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.txt,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png,.gif" style="display: none;">
            </div>
            
            <div id="uploadProgress" class="hidden">
                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="text-center" id="progressText">Uploading...</div>
            </div>
            
            <div id="uploadedFiles"></div>
        </div>

        <!-- Profile Page -->
        <div id="profilePage" class="hidden">
            <h1 class="mb-3">Profile</h1>
            <div class="auth-card" style="max-width: 600px; margin: 0 auto;">
                <div id="profileAlert"></div>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="profileFullName" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="profileEmail" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Subject</label>
                        <input type="text" class="form-input" id="profileSubject">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">School</label>
                        <input type="text" class="form-input" id="profileSchool">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        Update Profile
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="previewTitle">File Preview</h3>
                <button class="modal-close" onclick="closeModal('previewModal')">&times;</button>
            </div>
            <div class="modal-body" id="previewContent">
                <!-- Preview content will be loaded here -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('previewModal')">Close</button>
                <button class="btn btn-primary" id="downloadFromPreview">
                    <i class="fas fa-download"></i>
                    Download
                </button>
            </div>
        </div>
    </div>

    <!-- File Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Edit File</h3>
                <button class="modal-close" onclick="closeModal('editModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editFileForm">
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" id="editDescription" rows="3" placeholder="Add a description..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select class="form-input" id="editCategory">
                            <option value="document">Document</option>
                            <option value="image">Image</option>
                            <option value="presentation">Presentation</option>
                            <option value="spreadsheet">Spreadsheet</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" id="editIsPublic"> Make this file public
                        </label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('editModal')">Cancel</button>
                <button class="btn btn-primary" id="saveFileEdit">
                    <i class="fas fa-save"></i>
                    Save Changes
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
